name: Build KDP Release Candidates
on:
  workflow_dispatch:
  push:
    branches:
      - release/kdp-production-build
    paths:
      - "publishing/build/**"
      - "tests/**"
      - "publishing/production/KDP-UPLOAD-METADATA.md"
      - "manuscript/en/FULL-ENGLISH-MANUSCRIPT.md"
      - "manuscript/ar/FULL-ARABIC-MANUSCRIPT.md"
      - ".github/workflows/kdp-production-build.yml"
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install publishing toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-fonts-recommended fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install pillow pypdf python-docx lxml arabic-reshaper python-bidi
      - name: Verify XeLaTeX font stack
        run: |
          command -v xelatex
          kpsewhich fontspec.sty
          kpsewhich iftex.sty
          kpsewhich pzdr.tfm
          fc-match "Noto Serif"
      - name: Run manuscript regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and validate release candidates
        run: python publishing/build/build_release.py
      - name: Upload preview and release candidates
        uses: actions/upload-artifact@v4
        with:
          name: kdp-release-candidates
          path: publishing/release-candidate/
          if-no-files-found: error
          retention-days: 30
